manifest_version: 1
id: lv2_zamdynamiceq
display_name: ZamDynamicEQ
description: ZamDynamicEQ — dynamic EQ band that boosts or cuts only when the signal crosses the threshold.
brand: zam
license: GPL-2.0
homepage: https://github.com/zamaudio/zam-plugins
type: filter
backend: lv2
plugin_uri: urn:zamaudio:ZamDynamicEQ
binaries:
  macos-universal: platform/macos-universal/ZamDynamicEQ_dsp.dylib
  windows-x86_64: platform/windows-x86_64/ZamDynamicEQ_dsp.dll
  linux-x86_64: platform/linux-x86_64/ZamDynamicEQ_dsp.so
  linux-aarch64: platform/linux-aarch64/ZamDynamicEQ_dsp.so
# Parameter tabs for the block editor (issue #119). Keyed by the port's
# lv2:symbol; the live TTL stays the source of truth for which ports exist and
# for their names. Tabs mirror the plugin's own UI sections.
parameters:
  - symbol: att
    group: Dynamics
  - symbol: rel
    group: Dynamics
  - symbol: kn
    group: Dynamics
  - symbol: rat
    group: Dynamics
  - symbol: thr
    group: Dynamics
  - symbol: max
    group: Dynamics
  - symbol: slew
    group: Dynamics
  - symbol: sidech
    group: Dynamics
  - symbol: togglelow
    group: Filter
  - symbol: togglepeak
    group: Filter
  - symbol: togglehigh
    group: Filter
  - symbol: detectfreq
    group: Filter
  - symbol: targetfreq
    group: Filter
  - symbol: targetwidth
    group: Filter
  - symbol: boostcut
    group: Filter
