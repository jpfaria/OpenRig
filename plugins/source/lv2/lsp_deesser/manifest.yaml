manifest_version: 1
id: lv2_lsp_deesser
display_name: LSP De-esser
description: LSP De-esser — stereo de-esser with split-band processing and sidechain filters.
brand: lsp
license: LGPL-3.0
homepage: https://lsp-plug.in
type: dyn
backend: lv2
plugin_uri: http://lsp-plug.in/plugins/lv2/deesser_stereo
binaries:
  linux-x86_64: platform/linux-x86_64/lsp-plugins-lv2.so
  linux-aarch64: platform/linux-aarch64/lsp-plugins-lv2.so
# Parameter tabs for the block editor (issue #119). Keyed by the port's
# lv2:symbol; the live TTL stays the source of truth for which ports exist and
# for their names. Display holds the plugin GUI's analyzer and graph toggles.
