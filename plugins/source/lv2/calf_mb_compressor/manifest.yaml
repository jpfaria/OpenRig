manifest_version: 1
id: lv2_calf_mb_compressor
display_name: Calf Multiband Compressor
description: Calf Multiband Compressor — four-band stereo compressor with adjustable crossovers.
brand: calf
license: LGPL-2.1
homepage: https://calf-studio-gear.org
type: dyn
backend: lv2
plugin_uri: http://calf.sourceforge.net/plugins/MultibandCompressor
binaries:
  macos-universal: platform/macos-universal/calf.dylib
  linux-x86_64: platform/linux-x86_64/calf.so
  linux-aarch64: platform/linux-aarch64/calf.so
# Parameter tabs for the block editor (issue #119). Keyed by the port's
# lv2:symbol; the live TTL stays the source of truth for which ports exist and
# for their names. Display holds the plugin GUI's notebook page selector.
