# Coverage config (#913).
#
# `ignore:` is a DEBT LIST, not a permanent carve-out. Each entry is a file no
# test can reach today, for a stated reason. Entries LEAVE the list when the
# logic moves somewhere a test can call it; nothing is added without writing
# the reason down in docs/testing.md.
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: auto
        threshold: 1%

ignore:
  # ── Stream construction: needs a real audio device ────────────────────────
  # Building a cpal stream requires a `cpal::Device`, which cannot be faked —
  # `ResolvedInputDevice`/`ResolvedOutputDevice` carry the device itself. These
  # two are exercised by the real-hardware battery (OPENRIG_HW_TESTS=1), which
  # does not run in CI and produces no coverage.
  - "crates/infra-cpal/src/stream_builder_input.rs"
  - "crates/infra-cpal/src/stream_builder_output.rs"

  # ── Window wiring: registers callbacks on an AppWindow ────────────────────
  # The repo's law keeps `AppWindow` out of tests, so a file whose whole body
  # is `window.on_x(...)` registration is unreachable by construction. The way
  # off this list is the `looper_commands` pattern: the closure body becomes a
  # pure function the wiring only calls, and THAT function gets the test.
  #
  # #913 walked this list once already: `settings/paths_apply.rs` and
  # `device_refresh_list.rs` came OFF it that way, and every file left here has
  # had its logic pulled out into a tested module — what remains in them really
  # is registration and window setters.
  - "crates/adapter-gui/src/desktop_app.rs"
  - "crates/adapter-gui/src/desktop_app_language.rs"
  - "crates/adapter-gui/src/desktop_app_mcp.rs"
  - "crates/adapter-gui/src/desktop_app_project_wiring.rs"
  - "crates/adapter-gui/src/desktop_app_settings_wiring.rs"
  - "crates/adapter-gui/src/desktop_app_windows.rs"
  - "crates/adapter-gui/src/block_parameter_extras.rs"
  - "crates/adapter-gui/src/block_parameter_wiring.rs"
  - "crates/adapter-gui/src/settings/paths_seed.rs"

  # The shells #913 emptied. Each of these had its logic pulled into a module
  # that IS tested — `recent_projects_wiring` → `recent_project_open` +
  # `recent_project_remove`, `preset_save_wiring` → `preset_save`,
  # `latency_probe` → `latency_probe_run` + `latency_badge_expiry`, and so on.
  # What is left in the file is `window.on_x(...)` and window setters. They are
  # here because they meet the criterion above, NOT to move a number: each one
  # earned its place by having its logic taken out first, and the day a body
  # grows back the entry has to come off with it.
  - "crates/adapter-gui/src/audio_wizard_wiring.rs"
  - "crates/adapter-gui/src/back_to_launcher_wiring.rs"
  - "crates/adapter-gui/src/block_delete_wiring.rs"
  - "crates/adapter-gui/src/block_drawer_close_wiring.rs"
  - "crates/adapter-gui/src/block_picker_wiring.rs"
  - "crates/adapter-gui/src/chain_block_crud_wiring.rs"
  - "crates/adapter-gui/src/chain_editor_save_cancel_callbacks.rs"
  - "crates/adapter-gui/src/chain_preset_wiring.rs"
  - "crates/adapter-gui/src/chain_row_wiring_actions.rs"
  - "crates/adapter-gui/src/chain_save_cancel_callbacks.rs"
  - "crates/adapter-gui/src/desktop_app_cli_open.rs"
  - "crates/adapter-gui/src/desktop_app_polling.rs"
  - "crates/adapter-gui/src/di_loop_chooser_wiring.rs"
  - "crates/adapter-gui/src/latency_probe.rs"
  - "crates/adapter-gui/src/midi_adapter_wiring.rs"
  - "crates/adapter-gui/src/plugin_info_inline_wiring.rs"
  - "crates/adapter-gui/src/preset_save_wiring.rs"
  - "crates/adapter-gui/src/project_file_dialog_wiring.rs"
  - "crates/adapter-gui/src/recent_projects_wiring.rs"
  - "crates/adapter-gui/src/settings/integrations.rs"
  - "crates/adapter-gui/src/spectrum_wiring.rs"
  - "crates/adapter-gui/src/tuner_wiring.rs"

  # ── Test code itself ──────────────────────────────────────────────────────
  - "crates/**/*_tests.rs"
  - "crates/**/tests.rs"
  - "crates/*/tests/**"
