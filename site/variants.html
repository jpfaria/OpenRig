<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenRig — variações do topo</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Archivo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css"><link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/type.css"><link rel="stylesheet" href="css/buttons.css">
<link rel="stylesheet" href="css/hero.css"><link rel="stylesheet" href="css/layout.css">
<style>
body{background:#0b0b0d}
.v{position:relative;border-bottom:1px solid #222;padding:64px 0 56px;background:linear-gradient(180deg,#141416,#0b0b0d)}
.v .wrap{max-width:1180px;margin:0 auto;padding:0 40px}
.n{position:absolute;top:18px;left:40px;font:700 13px/1 Archivo,sans-serif;color:#ff9d3d;letter-spacing:.14em}
.v h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(40px,5.4vw,76px);line-height:.95;color:#fff;margin:14px 0 0;letter-spacing:.005em}
.v h1 em{font-style:normal;color:#ff9d3d}
.v .eyebrow{font:600 12px/1 Archivo,sans-serif;color:#8a8a92;letter-spacing:.2em;text-transform:uppercase}
.v .lede{font:400 17px/1.6 Archivo,sans-serif;color:#b8b8c0;margin:18px 0 0;max-width:60ch}
.v .cta{margin-top:26px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.v .b1{background:#ff9d3d;color:#141416;font:700 13px/1 Archivo,sans-serif;padding:14px 22px;border-radius:6px;letter-spacing:.06em}
.v .b2{border:1px solid #3a3a42;color:#e8e8ee;font:700 13px/1 Archivo,sans-serif;padding:14px 22px;border-radius:6px;letter-spacing:.06em}
</style></head><body>
<div id="all"></div>
<script>
const LEDE = '724 amps, caixas e pedais inclusos. Carrega NAM A1 e A2 em tamanho full.';
const V = [
 "Tudo que você precisa<br>pra montar teu rig,<br><em>em um lugar só.</em>",
 "Tudo que você precisa<br><em>em um lugar só.</em>",
 "Amp, caixa, pedal, captura<br>e plugin —<br><em>tudo em um lugar só.</em>",
 "Todo o teu equipamento<br><em>em um lugar só.</em>",
 "Um lugar só<br><em>pra tudo que você pluga.</em>",
 "Tudo em um lugar só,<br>pra cada instrumento,<br><em>ao mesmo tempo.</em>",
 "Teu rig inteiro<br>em um lugar só —<br><em>e um pra cada instrumento.</em>",
 "Tudo que um rig precisa,<br>sem comprar nada:<br><em>724 equipamentos inclusos.</em>",
];
document.getElementById('all').innerHTML = V.map((h,i)=>`
<section class="v"><span class="n">${String(i+1).padStart(2,'0')}</span><div class="wrap">
<p class="eyebrow">Grátis · Código aberto</p>
<h1>${h}</h1><p class="lede">${LEDE}</p>
<div class="cta"><span class="b1">BAIXAR</span><span class="b2">VER O RIG</span></div>
</div></section>`).join('');
</script></body></html>
