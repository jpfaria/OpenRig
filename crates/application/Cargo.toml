[package]
name = "application"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
arc-swap.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
schemars.workspace = true
futures.workspace = true
# #323: the recorded loop is written as a wav sidecar next to the project.
hound = "3.5"
project = { path = "../project" }
engine = { path = "../engine" }
feature-dsp = { path = "../feature-dsp" }
block-core = { path = "../block-core" }
domain = { path = "../domain" }
infra-filesystem = { path = "../infra-filesystem" }
infra-yaml = { path = "../infra-yaml" }
plugin-loader = { path = "../plugin-loader" }
adapter-render = { path = "../adapter-render" }
# Backing-track player: decodes wav/flac/mp3/ogg/m4a (AAC) files.
symphonia = { version = "0.6.1", default-features = false, features = ["aac", "isomp4", "mp3", "flac", "wav", "pcm", "ogg", "vorbis", "opt-simd"] }
# #1039: drum kits are Hydrogen drumkit.xml folders resampled to the stream rate.
ir = { path = "../ir" }
roxmltree = "0.21"
# #879: TONE3000 API client (search, models, downloads) over rustls.
ureq = { version = "3", default-features = false, features = ["rustls"] }
percent-encoding = "2"
# #879: installed TONE3000 packages are levelled like the curated catalog
# (NAM render + IR convolution against the synthetic DI).
nam = { path = "../nam" }
realfft = "3"

[dev-dependencies]
block-core = { path = "../block-core" }
block-delay = { path = "../block-delay" }
# #791: the Tone Doctor tests need a chain that measurably fizzes.
block-gain = { path = "../block-gain" }
block-reverb = { path = "../block-reverb" }
serde_yaml.workspace = true
tempfile = "3"
# #780 end-to-end test: drive a real VST3 controller + register its context.
vst3-host = { path = "../vst3-host" }
