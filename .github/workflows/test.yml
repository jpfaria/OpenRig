name: Test

# Covers every branch the release-branch gitflow (#837) merges into, not just
# `develop` — otherwise a release branch and `main` accumulate untested commits
# and the only evidence before a tag is a green run on some earlier tip (#862).
on:
  pull_request:
    branches: [develop, 'release/**', main]
    types: [opened, reopened, synchronize]
  push:
    branches: [develop, 'release/**', main]

# One run per PR (or per branch push); cancel superseded runs.
concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Whole-repo static gate (file-size caps + no inline test modules). Runs over
  # every tracked file, not just the diff, so debt can't grow outside the frozen
  # allowlist. Build-free (VALIDATE_STATIC_ONLY) — fmt/clippy/slint are the
  # shared quality gate's job, not this one. See issue #793 / #792.
  validate-static:
    name: Static Checks (whole repo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate file sizes and inline test modules
        run: VALIDATE_STATIC_ONLY=1 ./scripts/validate.sh crates
      # #974: nam-refresh uses this script to write develop.
      - name: Test the NeuralAmpModelerCore vendor script
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest -q scripts/test_nam_vendor.py
      - name: Test the pre-PR gate and its hook
        run: python3 -m pytest -q scripts/test_pre_pr_gate.py
      - name: Test the build lock and its hook
        run: python3 -m pytest -q scripts/test_cargo_locked.py

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    # A warning fails the job like an error: Linux-only warnings (a helper
    # left unused by a `cfg(not(all(target_os = "linux", feature = "jack")))`
    # test) never show up on the owner's Mac. Job-level, so rust-cache keys on it.
    env:
      RUSTFLAGS: -D warnings
    steps:
      # The debug test binaries of the whole workspace outgrow the runner's
      # free disk: lld then dies with SIGBUS (signal 7) while writing the
      # adapter-gui test binary. Drop the preinstalled toolchains this job
      # never uses before building.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /

      - uses: actions/checkout@v4
        with:
          # #974: LFS carries the vendored NeuralAmpModelerCore archive.
          lfs: true

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # #991: rust-cache keys on the members' manifests and Cargo.lock, not on
      # the root manifest, whose profiles and workspace features rebuild every
      # dependency when they change. Its RUST* env vars are part of the key.
      # The release version line is left out: it changes on every release.
      - name: Key the cache on the root manifest
        run: echo "RUST_CACHE_ROOT_MANIFEST=$(grep -v '^version = ' Cargo.toml | sha256sum | cut -c1-16)" >> "$GITHUB_ENV"

      # #991: with no cache every run compiled 516 third-party crates (557
      # with the workspace) from scratch — ~12 of the job's ~20 minutes. Only
      # branch pushes save, so a PR run restores its base branch's cache
      # instead of adding its own to the repo's 10 GB quota. Workspace crates
      # are never cached. A failed run still saves: its dependencies built.
      - name: Cache cargo registry and dependency builds
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-debug
          save-if: ${{ github.event_name == 'push' }}
          cache-on-failure: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libudev-dev pkg-config \
            libfontconfig1-dev libseat-dev \
            libxkbcommon-dev libinput-dev libgbm-dev \
            libjack-jackd2-dev gettext

      # The suite must be able to fail the job — no `|| true`. Tests that need
      # the owner's private capture tree (OPENRIG_OWNER_PLUGINS) skip loudly
      # when it is absent; they never hard-fail CI. See issue #793.
      # A hard timeout keeps a hung test from wedging the runner for hours
      # (see issue #693 FIFO tests, fixed to never block the test thread).
      # nextest runs every test binary in parallel; it skips doctests, so
      # `cargo test --doc` runs them after. scripts/pre-pr-gate.sh runs the same.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # A failed run saves its cache, and a saved key is never overwritten. Cargo
      # stops starting new crates at the first compile error, so a red workspace
      # crate used to save a cache with most dependencies missing, and every run
      # after it compiled them all again. --keep-going builds every crate the
      # error does not block, so the saved cache always holds all dependencies.
      - name: Build tests
        run: timeout --signal=SIGKILL 1500 cargo build --workspace --tests --keep-going

      - name: Run tests
        run: |
          timeout --signal=SIGKILL 1500 cargo nextest run --workspace --no-fail-fast
          timeout --signal=SIGKILL 600 cargo test --workspace --doc

      - name: Disk left after the build
        if: always()
        run: df -h /

  # #974: after develop's own tests pass, move the vendored NeuralAmpModelerCore
  # to the newest upstream release. The new version is tested here, in its own
  # job, and pushed to develop only when the whole suite passes — a release
  # that breaks the build or the tests never lands, and this job goes red
  # naming it. Only develop: release branches take the new NAM when they are
  # cut from it, and a bot push there would leave the release→main PR head
  # with no checks (GITHUB_TOKEN pushes trigger no workflow). An unreachable
  # upstream or a refused push is a warning.
  nam-refresh:
    name: Refresh vendored NeuralAmpModelerCore
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Vendor the newest upstream release
        id: vendor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 scripts/nam_vendor.py update
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust stable
        if: steps.vendor.outputs.bumped == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Key the cache on the root manifest
        if: steps.vendor.outputs.bumped == 'true'
        run: echo "RUST_CACHE_ROOT_MANIFEST=$(grep -v '^version = ' Cargo.toml | sha256sum | cut -c1-16)" >> "$GITHUB_ENV"

      # #991: same debug build as the Test Suite, so it reads that job's cache.
      - name: Restore the Test Suite's dependency cache
        if: steps.vendor.outputs.bumped == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-debug
          save-if: false

      - name: Install system dependencies
        if: steps.vendor.outputs.bumped == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libudev-dev pkg-config \
            libfontconfig1-dev libseat-dev \
            libxkbcommon-dev libinput-dev libgbm-dev \
            libjack-jackd2-dev gettext

      - name: Test the new release
        if: steps.vendor.outputs.bumped == 'true'
        run: timeout --signal=SIGKILL 1500 cargo test --workspace

      - name: Push it to develop
        if: steps.vendor.outputs.bumped == 'true'
        run: python3 scripts/nam_vendor.py push

  # Coverage is REPORTING, not a gate. It lives in its own job with
  # continue-on-error so it can NEVER block a PR whose tests passed: the
  # `cargo llvm-cov` instrumented rebuild + full re-run of this large
  # audio/Slint workspace is heavy enough to exhaust an ubuntu runner (OOM /
  # disk), and a killed runner ignores an inline `|| true`. Isolating it keeps
  # the Test Suite result about tests only. See issue #793.
  coverage:
    name: Coverage (reporting)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          # #974: LFS carries the vendored NeuralAmpModelerCore archive.
          lfs: true

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Key the cache on the root manifest
        run: echo "RUST_CACHE_ROOT_MANIFEST=$(grep -v '^version = ' Cargo.toml | sha256sum | cut -c1-16)" >> "$GITHUB_ENV"

      # #991: the instrumented build has its own cache (separate
      # target/llvm-cov-target); same save rules as the Test Suite. Saving on
      # failure matters here: a cold run can hit the 30-min step limit after
      # its dependencies are built, and without it the next run is cold again.
      - name: Cache cargo registry and dependency builds
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: coverage-instrumented
          save-if: ${{ github.event_name == 'push' }}
          cache-on-failure: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libudev-dev pkg-config \
            libfontconfig1-dev libseat-dev \
            libxkbcommon-dev libinput-dev libgbm-dev \
            libjack-jackd2-dev gettext

      # #991: prebuilt binary; `cargo install` compiled it from source (~1 min).
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage report
        timeout-minutes: 30
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info || true

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lcov-coverage
          path: lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: always()
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
