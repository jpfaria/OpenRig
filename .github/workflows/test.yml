name: Test

# Covers every branch the release-branch gitflow (#837) merges into, not just
# `develop` — otherwise a release branch and `main` accumulate untested commits
# and the only evidence before a tag is a green run on some earlier tip (#862).
on:
  pull_request:
    branches: [develop, 'release/**', main]
    types: [opened, reopened, synchronize]
  push:
    branches: [develop, 'release/**', main]
  # Lets an issue branch run the suite (Windows included) before it has a PR.
  workflow_dispatch:

# One run per PR (or per branch push); cancel superseded runs.
concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Whole-repo static gate (file-size caps + no inline test modules). Runs over
  # every tracked file, not just the diff, so debt can't grow outside the frozen
  # allowlist. Build-free (VALIDATE_STATIC_ONLY) — fmt/clippy/slint are the
  # shared quality gate's job, not this one. See issue #793 / #792.
  validate-static:
    name: Static Checks (whole repo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate file sizes and inline test modules
        run: VALIDATE_STATIC_ONLY=1 ./scripts/validate.sh crates

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libudev-dev pkg-config \
            libfontconfig1-dev libseat-dev \
            libxkbcommon-dev libinput-dev libgbm-dev \
            libjack-jackd2-dev gettext

      # The suite must be able to fail the job — no `|| true`. Tests that need
      # the owner's private capture tree (OPENRIG_OWNER_PLUGINS) skip loudly
      # when it is absent; they never hard-fail CI. See issue #793.
      # A hard timeout keeps a hung test from wedging the runner for hours
      # (see issue #693 FIFO tests, fixed to never block the test thread).
      - name: Run tests
        run: timeout --signal=SIGKILL 1500 cargo test --workspace

  # release.yml's Windows tag builds `source` scripts/lib/release-version.sh in
  # Git Bash. A CRLF checkout breaks the function definitions, and that step
  # had never run on Windows before #978. Seconds, so it is its own job.
  windows-scripts:
    name: Scripts on Windows checkout
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash helpers load on the Windows checkout
        shell: bash
        run: |
          source scripts/lib/release-version.sh
          test "$(release_version_from_tag v1.2.3)" = "1.2.3"

  # Windows build + tests (#978). Nothing compiled the app for Windows between
  # #816 (2026-07-23) and this job, and the Linux job above compiles infra-cpal
  # with `jack` (feature unification), so the cpal/ASIO path and every
  # cfg(windows) arm were type-checked nowhere. Same ASIO SDK + LLVM recipe as
  # release.yml build-windows. Warnings fail the job: zero warnings holds on
  # every target, not just the one the developer happens to run.
  windows:
    name: Test Suite (Windows)
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      RUSTFLAGS: -D warnings
      CARGO_INCREMENTAL: 0
      # PDBs for the whole debug workspace do not fit the runner disk.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-test
          # A red run still compiled ~all the dependencies; keep them.
          cache-on-failure: true

      - name: Download ASIO SDK
        shell: pwsh
        run: |
          $sdk_url = "https://download.steinberg.net/sdk_downloads/asiosdk_2.3.3_2019-06-14.zip"
          Invoke-WebRequest -Uri $sdk_url -OutFile asiosdk.zip
          Expand-Archive -Path asiosdk.zip -DestinationPath C:\asiosdk
          $sdk_dir = (Get-ChildItem C:\asiosdk -Directory)[0].FullName
          "CPAL_ASIO_DIR=$sdk_dir" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install LLVM/clang (required by ASIO bindgen)
        run: choco install llvm -y --no-progress

      - name: Build
        run: cargo build --workspace

      # --no-fail-fast: one Windows run reports every failing crate, not just
      # the first, while the port is being brought up (#978).
      # TEMPORARY (#978): one test thread, so the test that takes a process
      # down with STATUS_ACCESS_VIOLATION is the last one the log started.
      - name: Run tests
        timeout-minutes: 90
        run: cargo test --workspace --no-fail-fast -- --test-threads=1

  # Coverage is REPORTING, not a gate. It lives in its own job with
  # continue-on-error so it can NEVER block a PR whose tests passed: the
  # `cargo llvm-cov` instrumented rebuild + full re-run of this large
  # audio/Slint workspace is heavy enough to exhaust an ubuntu runner (OOM /
  # disk), and a killed runner ignores an inline `|| true`. Isolating it keeps
  # the Test Suite result about tests only. See issue #793.
  coverage:
    name: Coverage (reporting)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libudev-dev pkg-config \
            libfontconfig1-dev libseat-dev \
            libxkbcommon-dev libinput-dev libgbm-dev \
            libjack-jackd2-dev gettext

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov

      - name: Generate coverage report
        timeout-minutes: 30
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info || true

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lcov-coverage
          path: lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: always()
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
